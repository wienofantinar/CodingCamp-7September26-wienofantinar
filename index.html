<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Productivity Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

    <!-- Top bar -->
    <header id="top-bar">
      <span id="top-bar-title">Dashboard</span>
      <div id="top-bar-actions">
        <button id="theme-toggle" class="btn btn-ghost" aria-label="Toggle dark mode" title="Toggle light/dark mode">
          <span id="theme-icon">&#127769;</span>
        </button>
      </div>
    </header>

    <!-- Name setup modal (shown once on first visit) -->
    <div id="name-modal" class="modal-overlay" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="name-modal-heading">
        <h2 id="name-modal-heading">Welcome! What's your name?</h2>
        <p class="modal-desc">Your name will appear in the greeting.</p>
        <input
          id="name-input"
          type="text"
          class="input-text"
          placeholder="Enter your name..."
          maxlength="40"
          autocomplete="off"
        />
        <p id="name-error" class="error-message" aria-live="polite"></p>
        <div class="modal-actions">
          <button id="name-save-btn" class="btn btn-primary">Save</button>
          <button id="name-skip-btn" class="btn btn-secondary">Skip</button>
        </div>
      </div>
    </div>

    <!-- Widgets -->
    <main id="dashboard">
      <section id="greeting-widget">
        <h2>Greeting</h2>
        <div class="widget-content"></div>
      </section>

      <section id="focus-timer">
        <h2>Focus Timer</h2>
        <div class="widget-content"></div>
      </section>

      <section id="task-manager">
        <h2>Task Manager</h2>
        <div class="widget-content"></div>
      </section>

      <section id="quick-links">
        <h2>Quick Links</h2>
        <div class="widget-content"></div>
      </section>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
